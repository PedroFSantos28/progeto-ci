
name: CI - Verificar API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verificar-api:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install fastapi "uvicorn[standard]" pytest httpx

      - name: Rodar Testes
        run: python -m pytest -v

      - name: Subir a API e testar requisição (Integração)
        run: |
          python -m uvicorn main:app --host 127.0.0.1 --port 8000 > uvicorn.log 2>&1 &
          sleep 3
          curl -f http://127.0.0.1:8000/
          curl -f http://127.0.0.1:8000/somar/10/20
          curl -f http://127.0.0.1:8000/multiplicar/2/2
